name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs: 
  build-and-test:
    runs-on: ubuntu-22.04

    steps:
      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Build TypeScript automatically
      - name: Build TypeScript
        run: npm run build
        # Make sure your package.json has a "build" script: "tsc"

      # 5. Run tests
      - name: Run tests
        run: npm start
